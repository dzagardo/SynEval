# configs/cross_group_dp.yaml
# Configuration file for Differential Privacy evaluation runner
# This config specifies experiments across different epsilon values and windowing methods

# Experiment directories with their aliases
experiment_directories:
  # Row-based DP experiments
  OUTPUT_GRID_ROW_DP_EXTREMA: 
    path: "experiments/data/OUTPUT_GRID_ROW_DP_EXTREMA"
    display_name: "Row DP + Extrema Protection, 10k"
    
  OUTPUT_GRID_ROW_DP_EXTREMA_LONG: 
    path: "experiments/data/OUTPUT_GRID_ROW_DP_EXTREMA_LONG"
    display_name: "Row DP + Extrema Protection, 20k"
    
  OUTPUT_GRID_ROW_TRUE_EXTREMA: 
    path: "experiments/data/OUTPUT_GRID_ROW_TRUE_EXTREMA"
    display_name: "Row DP + True Extrema, 10k"
    
  OUTPUT_GRID_ROW_TRUE_EXTREMA_2_5_NORM_64_BATCH: 
    path: "experiments/data/OUTPUT_GRID_ROW_TRUE_EXTREMA_2_5_NORM_64_BATCH"
    display_name: "Row DP + True Extrema, 2.5 Clip, 64 Batch"
    
  OUTPUT_GRID_ROW_TRUE_EXTREMA_LONG: 
    path: "experiments/data/OUTPUT_GRID_ROW_TRUE_EXTREMA_LONG"
    display_name: "Row DP + True Extrema, 20k"
  
  # Window-based DP experiments
  OUTPUT_GRID_WINDOW_DP_EXTREMA: 
    path: "experiments/data/OUTPUT_GRID_WINDOW_DP_EXTREMA"
    display_name: "Window DP + Extrema Protection, 10k"
    
  OUTPUT_GRID_WINDOW_DP_EXTREMA_LONG: 
    path: "experiments/data/OUTPUT_GRID_WINDOW_DP_EXTREMA_LONG"
    display_name: "Window DP + Extrema Protection, 20k"
    
  OUTPUT_GRID_WINDOW_TRUE_EXTREMA: 
    path: "experiments/data/OUTPUT_GRID_WINDOW_TRUE_EXTREMA"
    display_name: "Window DP + True Extrema, 10k"
    
  OUTPUT_GRID_WINDOW_TRUE_EXTREMA_2_5_NORM_64_BATCH: 
    path: "experiments/data/OUTPUT_GRID_WINDOW_TRUE_EXTREMA_2_5_NORM_64_BATCH"
    display_name: "Window DP + True Extrema, 2.5 Clip, 64 Batch"
    
  OUTPUT_GRID_WINDOW_TRUE_EXTREMA_LONG: 
    path: "experiments/data/OUTPUT_GRID_WINDOW_TRUE_EXTREMA_LONG"
    display_name: "Window DP + True Extrema, 20k"

# Data configuration
data_config:
  # Path within experiment directories to data files (relative to experiment dir)
  data_dir: "stocks"
  
  # Train data file name
  train_data: "samples/stocks_ground_truth_24_train.csv"
  
  # Test data file name
  test_data: "samples/stocks_ground_truth_24_test.npy"
  
  # Synthetic data file name (generated by DDPM)
  synthetic_data: "ddpm_fake_stocks.csv"
  
  # Path pattern for data files with epsilon wildcard
  # Use {epsilon} as placeholder in paths
  data_path_pattern: "{experiment_dir}/{prefix}{epsilon}/{data_dir}"

# Model configuration
model_config:
  # Path within experiment directories to model files (relative to experiment dir)
  model_dir: "stocks/checkpoints"
  
  # Model checkpoint file name
  model_file: "checkpoint-10.pt"
  
  # Path pattern for model files with epsilon wildcard
  # Use {epsilon} as placeholder in paths
  model_path_pattern: "{experiment_dir}/{prefix}{epsilon}/{model_dir}"

# Epsilon values for differential privacy
# "Inf" represents Non-DP (no differential privacy)
epsilons:
  - "1"
  - "10"
  - "100"
  - "1000"
  - "10000"
  - "Inf"

# Prefix configuration
# Used to construct experiment directory names (e.g., dp_eps1, dp_eps10, etc.)
experiment_prefix: "dp_eps"

# SynEval experiments to run
# Each experiment type will be executed with the specified configurations
# Leave parameters empty to use defaults
syneval_experiments:
  # Fidelity evaluation - measures statistical similarity to real data
  fidelity:
    enabled: true
    # Uses SDV quality score, SDV diagnostic score, text fidelity, numerical statistics
    # Includes distinguishability test (AUC for real vs synthetic discrimination)
    # No custom parameters - using defaults
    
  # Utility evaluation - measures ML task performance
  utility:
    enabled: true
    # Uses TSTR (Train on Synthetic, Test on Real) methodology
    # No custom parameters - using defaults
    
  # Privacy evaluation - measures privacy preservation
  privacy:
    enabled: true
    # Includes exact match detection, DCR, NNDR
    # Anonymeter metrics (singling out, linkability, inference)
    # No custom parameters - using defaults
    
  # Diversity evaluation - measures data variety
  diversity:
    enabled: true
    # Measures coverage, uniqueness, entropy
    # No custom parameters - using defaults
    
  # Membership Inference Attack evaluation
  mia:
    enabled: true
    # Tests vulnerability to membership inference
    # No custom parameters - using defaults

mia:
  enabled: true
  adapter: diffusion_ts
  dataset: stocks
  n_shadow: 1000

# Utility evaluation configuration
utility:
  # Column to predict during utility (regression target)
  target_column: "Close"
  # Feature columns exposed to the utility evaluator
  input_columns:
    - "Open"
    - "Volume"
    - "Low"
    - "High"
  # Optional list of utility metrics to execute
  selected_metrics:
    - "tstr_accuracy"
    - "correlation_analysis"

# Privacy evaluation configuration
privacy:
  skip_anonymeter: true  # avoid the heavy anonymeter attack by default
  # max_rows: 20000      # optional sampling cap; uncomment to downsample for privacy metrics

# Reporting configuration
reporting:
  # Generate individual experiment reports
  individual_reports: true
  
  # Generate in-group comparison reports (within same experiment group)
  in_group_comparisons: true
  
  # Generate cross-group comparison reports (across different experiment groups)
  cross_group_comparisons: true
  
  # Output directory for HTML reports
  reports_output_dir: "reports/dp_evaluation"
  
  # Report formats
  formats:
    - "html"  # Interactive HTML reports with charts
    - "json"  # Raw results in JSON format

# Execution configuration
execution:
  # Number of parallel workers for running experiments
  parallel_workers: 4
  
  # Device configuration for computation
  device: "auto"  # Options: "auto", "cuda", "cpu"
  
  # Enable caching for expensive computations
  enable_cache: true
  cache_dir: "./cache"
  
  # Logging configuration
  log_level: "INFO"
  log_file: "dp_evaluation.log"
  
  # Continue on experiment failure
  continue_on_error: true
  
  # Save intermediate results
  save_intermediate: true

# Validation configuration
validation:
  # Check that all required files exist before running
  check_files_exist: true
  
  # Validate data schema consistency
  validate_schema: true
